# ---------------------------------------------------------------------------
# tvclean – Konfiguration
#
# Nach jeder Änderung auf dem TV ausführen:
#   sh /var/lib/webosbrew/tvclean/tvclean.sh apply
# und danach einmal neu starten (Homebrew Channel → "System reboot").
#
# App-IDs bekommst du mit:
#   sh /var/lib/webosbrew/tvclean/tvclean.sh apps
# Mehrere IDs einfach mit Leerzeichen trennen (auch über mehrere Zeilen).
# ---------------------------------------------------------------------------

# App-ID deines Launchers (die App, mit der der TV nach dem Einschalten
# starten soll). Leer lassen = Launcher-Funktion aus.
# Beispiel: LAUNCHER_ID="com.example.launcher"
LAUNCHER_ID=""

# Home-Wächter: Sobald webOS seinen Home-Screen zeigt (Home-Taste, Einschalten,
# App beenden), wird sofort der Launcher geöffnet. 1 = an, 0 = aus
# Dazu in den TV-Einstellungen den Einschaltbildschirm auf "Home" stellen.
HOME_REDIRECT=1

# Launcher zusätzlich als TV-Eingang anmelden (alte Methode; er erscheint dann
# unter "Quellen"). Normalerweise nicht nötig. 1 = an, 0 = aus
LAUNCHER_AS_INPUT=0


# Apps, die aus dem Startmenü VERSCHWINDEN sollen (auch System-Apps, die
# sich nicht deinstallieren lassen). Nichts wird gelöscht – rückgängig,
# indem du die ID hier entfernst, "apply" ausführst und neu startest.
# Beispiele (IDs vorher mit "apps" prüfen, sie unterscheiden sich je Modell):
#   com.webos.app.discovery   (LG Content Store)
#   com.webos.app.lgchannels  (LG Channels)
HIDE_APPS="
"

# Apps, die per "tvclean.sh remove" DEINSTALLIERT werden sollen.
# Funktioniert nur bei Apps aus dem Content Store (z. B. vorinstallierte
# Streaming-Apps). System-Apps lassen sich nicht entfernen → oben ausblenden.
REMOVE_APPS="
"

# Werbung, Tracking, KI-Plattform und Firmware-Updates per /etc/hosts sperren.
# Der LG Content Store und App-Updates funktionieren weiterhin.
# 1 = an, 0 = aus
BLOCK_LG=1

# LG-ThinQ-Cloud sperren (Push-Nachrichten, Sport-Widgets, Cloud-Fernsteuerung).
# Die ThinQ-App als Fernbedienung im selben WLAN funktioniert meist trotzdem.
# 1 = an, 0 = aus
BLOCK_THINQ=1

# Eigene zusätzliche Domains, die gesperrt werden sollen (genaue Hostnamen,
# /etc/hosts kennt keine Platzhalter).
EXTRA_HOSTS="
"
